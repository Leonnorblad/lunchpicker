name: Hämta lunchmenyer

# Menyerna hämtas varje vardag av Claude Code-rutinen (se .claude/routines/).
# Den här Action finns kvar för att kunna köra det gamla skriptet för hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-menus
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hämta menyer
        run: python scripts/fetch_menus.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_TRACING_ENVIRONMENT: production

      - name: Spara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Menyer $(TZ=Europe/Stockholm date +%F)"
          git push
